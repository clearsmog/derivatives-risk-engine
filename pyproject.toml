[project]
name = "commodity-risk-engine"
version = "0.1.0"
description = "Commodity derivatives risk engine: pricing, Greeks, VaR/ES, P&L explain and FRTB SA (commodity), with an Atoti cube"
readme = "README.md"
authors = [
    { name = "clearsmog", email = "zqkntu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
cube = [
    "atoti>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
